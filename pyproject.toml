[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openshelter"
version = "0.1.0"
description = "Open-source multi-hazard resilient shelter design advisor (auditable, standards-aware pre-design briefs)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "OpenShelter contributors" }]
keywords = ["disaster-risk", "shelter", "building-codes", "resilience", "humanitarian", "open-government"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
# Core is deliberately dependency-free; only dev tooling below.

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openshelter = "openshelter.cli.main:main"

[tool.setuptools.packages.find]
include = ["openshelter*"]

[tool.setuptools.package-data]
openshelter = ["data/codes/*.json"]
